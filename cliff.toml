[changelog]
header = """# Changelog\n
"""
body = """

{% if version -%}
    ## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## Unreleased
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} **BREAKING**{% endif %}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true
postprocessors = [
    { pattern = "<!-- [0-9] -->", replace = "" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    # The changelog and GitHub release notes are for users: docs, refactors,
    # tests and chores are left out (see AGENTS.md, "Pull request naming").
    { message = ".*", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"
